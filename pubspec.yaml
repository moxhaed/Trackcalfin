name: trackcalfin
description: "Pantry, ledger and meal-prep tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State, routing, formatting
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.2
  collection: ^1.19.1
  async: ^2.13.0

  # Database
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: ^2.1.6

  # AI + secrets
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

  # Capture & input
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  speech_to_text: ^7.5.0

  # Platform entry points, background, notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10
  quick_actions: ^1.1.1
  receive_sharing_intent: ^1.9.0
  connectivity_plus: ^7.3.1

  # Backup
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned: isar_community_generator 3.3.2 needs analyzer <11, newer build_runner needs >=13.
  build_runner: 2.15.1
  isar_community_generator: 3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
